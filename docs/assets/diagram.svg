<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Forge Proposal Simulator architecture</title>
  <desc id="desc">Proposal inheritance at the top and the deploy, pre-build mock, build, simulate, validate, print, and optional JSON persistence lifecycle below.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .base { fill: #202a44; stroke: #111827; }
      .type { fill: #e8eefc; stroke: #4b67a1; }
      .project { fill: #e9f7ef; stroke: #3d7f59; }
      .stage { fill: #ffffff; stroke: #596579; }
      .optional { fill: #fff7df; stroke: #aa7b16; stroke-dasharray: 7 5; }
      .label { fill: #172033; font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #3c4658; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .inverse { fill: #ffffff; }
      .section { fill: #172033; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: none; stroke: #596579; stroke-width: 2.25; marker-end: url(#arrow); }
      .inherit { fill: none; stroke: #4b67a1; stroke-width: 2.25; marker-end: url(#triangle); }
      .choice { fill: none; stroke: #3d7f59; stroke-width: 2; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#596579"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,6 L0,12 z" fill="#f7f8fa" stroke="#4b67a1"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" rx="16"/>
  <text class="section" x="44" y="44">Contract inheritance</text>

  <rect class="base" x="455" y="64" width="290" height="72" rx="10"/>
  <text class="label inverse" x="600" y="94">Proposal</text>
  <text class="small inverse" x="600" y="117">actions, recorder, lifecycle, output</text>

  <rect class="type" x="40" y="196" width="250" height="72" rx="10"/>
  <text class="label" x="165" y="226">MultisigProposal</text>
  <text class="small" x="165" y="249">Safe MultiSend</text>

  <rect class="type" x="330" y="196" width="250" height="72" rx="10"/>
  <text class="label" x="455" y="226">TimelockProposal</text>
  <text class="small" x="455" y="249">scheduleBatch / executeBatch</text>

  <rect class="type" x="620" y="196" width="250" height="72" rx="10"/>
  <text class="label" x="745" y="226">GovernorBravoProposal</text>
  <text class="small" x="745" y="249">Bravo proposal lifecycle</text>

  <rect class="type" x="910" y="196" width="250" height="72" rx="10"/>
  <text class="label" x="1035" y="226">OZGovernorProposal</text>
  <text class="small" x="1035" y="249">Governor plus timelock</text>

  <path class="inherit" d="M165 196 C165 158 470 154 515 136"/>
  <path class="inherit" d="M455 196 C455 164 535 153 565 136"/>
  <path class="inherit" d="M745 196 C745 164 665 153 635 136"/>
  <path class="inherit" d="M1035 196 C1035 158 730 154 685 136"/>

  <path class="choice" d="M165 268 L165 286 L1035 286 L1035 268 M455 268 L455 286 M745 268 L745 286 M600 286 L600 310"/>

  <rect class="project" x="400" y="310" width="400" height="68" rx="10"/>
  <text class="label" x="600" y="338">Protocol proposal</text>
  <text class="small" x="600" y="361">inherits one proposal type and configures Addresses</text>

  <text class="section" x="44" y="432">Execution flow</text>

  <rect class="stage" x="40" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="107.5" y="497">deploy()</text>
  <text class="small" x="107.5" y="521">broadcast section</text>

  <rect class="stage" x="205" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="272.5" y="493">preBuild</text>
  <text class="label" x="272.5" y="514">Mock()</text>
  <text class="small" x="272.5" y="535">fork setup</text>

  <rect class="stage" x="370" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="437.5" y="497">build()</text>
  <text class="small" x="437.5" y="521">record actions</text>

  <rect class="stage" x="535" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="602.5" y="497">simulate()</text>
  <text class="small" x="602.5" y="521">execute on fork</text>

  <rect class="stage" x="700" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="767.5" y="497">validate()</text>
  <text class="small" x="767.5" y="521">assert final state</text>

  <rect class="stage" x="865" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="932.5" y="497">print()</text>
  <text class="small" x="932.5" y="521">results and payload</text>

  <rect class="optional" x="1030" y="466" width="135" height="78" rx="10"/>
  <text class="label" x="1097.5" y="497">updateJson()</text>
  <text class="small" x="1097.5" y="521">optional</text>

  <path class="arrow" d="M175 505 L197 505"/>
  <path class="arrow" d="M340 505 L362 505"/>
  <path class="arrow" d="M505 505 L527 505"/>
  <path class="arrow" d="M670 505 L692 505"/>
  <path class="arrow" d="M835 505 L857 505"/>
  <path class="arrow" d="M1000 505 L1022 505"/>

  <rect class="stage" x="370" y="602" width="300" height="100" rx="10"/>
  <text class="label" x="520" y="633">buildModifier(caller)</text>
  <text class="small" x="520" y="659">snapshotState → state diff → revertToState</text>
  <text class="small" x="520" y="682">direct Call accesses become Action entries</text>
  <path class="arrow" d="M437.5 544 L437.5 594"/>

  <rect class="stage" x="735" y="602" width="300" height="100" rx="10"/>
  <text class="label" x="885" y="633">Governance-specific execution</text>
  <text class="small" x="885" y="659">encode and execute the action payload</text>
  <text class="small" x="885" y="682">advance the protocol lifecycle</text>
  <path class="arrow" d="M602.5 544 C602.5 578 780 576 810 594"/>
</svg>
